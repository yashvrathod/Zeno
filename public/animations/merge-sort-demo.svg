<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeSlide {
      0%, 15% { opacity: 0; transform: translateY(-20px); }
      20%, 75% { opacity: 1; transform: translateY(0); }
      80%, 100% { opacity: 0.3; transform: translateY(10px); }
    }

    @keyframes merge {
      0%, 75% { opacity: 0.3; }
      80%, 100% { opacity: 1; }
    }

    @keyframes sorted {
      0%, 85% { opacity: 0.5; }
      90%, 100% { opacity: 1; fill: #065f46; }
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(168, 85, 247, 0.2)); }
      50% { filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6)); }
    }

    text {
      font-family: 'JetBrains Mono', monospace;
      text-anchor: middle;
      dominant-baseline: central;
      fill: #f4f4f5;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      fill: #e4e4e7;
      letter-spacing: 0.1em;
    }

    .subtitle {
      font-size: 12px;
      fill: #52525b;
    }

    /* Row 1: Original array - divides/splits */
    .orig { animation: fadeSlide 8s ease-in-out infinite; }

    /* Row 2: Split level - merges back */
    .merged { animation: merge 8s ease-in-out infinite; }

    /* Row 3: Sorted */
    .sorted-row { animation: sorted 8s ease-in-out infinite; }

    /* Connection lines */
    .connect { animation: fadeSlide 8s ease-in-out infinite; stroke: #a855f7; stroke-width: 1; stroke-opacity: 0.3; }

    /* Step description */
    .step-desc {
      animation: stepPulse 8s ease-in-out infinite;
    }

    @keyframes stepPulse {
      0%, 10% { opacity: 0; }
      15%, 40% { opacity: 1; }
      50%, 60% { opacity: 0.5; }
      65%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }

    @keyframes greenPulse {
      0%, 85% { opacity: 0; fill: #3f3f46; }
      90%, 100% { opacity: 1; fill: #10b981; }
    }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" rx="16" fill="#0a0a0c"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1" fill="#27272a"/>
  </pattern>
  <rect x="0" y="0" width="800" height="500" fill="url(#dots)"/>

  <!-- Title -->
  <text x="400" y="30" class="title" opacity="1">MERGE SORT</text>
  <text x="400" y="50" class="subtitle">Divide &amp; Conquer — O(n log n) guaranteed</text>

  <!-- ═══ DIVIDE (top half) ═══ -->
  <text x="100" y="90" font-size="11" fill="#a855f7" font-weight="700" opacity="1">DIVIDE</text>

  <!-- Row 1: Full array -->
  <g class="orig" transform="translate(150, 100)">
    <!-- Elements: [38, 27, 43, 3, 9, 82, 10] -->
    <rect x="0" y="0" width="65" height="50" rx="6" fill="#1a1a2e" stroke="#a855f7" stroke-width="1.5"/>
    <text x="32.5" y="25" font-size="14" fill="#f4f4f5">38</text>

    <rect x="70" y="0" width="65" height="50" rx="6" fill="#1a1a2e" stroke="#ef4444" stroke-width="1.5"/>
    <text x="102.5" y="25" font-size="14" fill="#f4f4f5">27</text>

    <rect x="140" y="0" width="65" height="50" rx="6" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="172.5" y="25" font-size="14" fill="#f4f4f5">43</text>

    <rect x="210" y="0" width="65" height="50" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="242.5" y="25" font-size="14" fill="#f4f4f5">3</text>

    <rect x="280" y="0" width="65" height="50" rx="6" fill="#1a1a2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="312.5" y="25" font-size="14" fill="#f4f4f5">9</text>

    <rect x="350" y="0" width="65" height="50" rx="6" fill="#1a1a2e" stroke="#ec4899" stroke-width="1.5"/>
    <text x="382.5" y="25" font-size="14" fill="#f4f4f5">82</text>

    <rect x="420" y="0" width="65" height="50" rx="6" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="452.5" y="25" font-size="14" fill="#f4f4f5">10</text>
  </g>

  <!-- Divide arrows / connections -->
  <g class="connect" opacity="1">
    <line x1="365" y1="165" x2="250" y2="195"/>
    <line x1="365" y1="165" x2="520" y2="195"/>
  </g>

  <!-- Row 2: First split -->
  <g class="orig" transform="translate(80, 195)">
    <rect x="50" y="0" width="65" height="45" rx="6" fill="#1a1a2e" stroke="#a855f7" stroke-width="1"/>
    <text x="82.5" y="22.5" font-size="13">38</text>
    <rect x="120" y="0" width="65" height="45" rx="6" fill="#1a1a2e" stroke="#ef4444" stroke-width="1"/>
    <text x="152.5" y="22.5" font-size="13">27</text>
    <rect x="190" y="0" width="65" height="45" rx="6" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1"/>
    <text x="222.5" y="22.5" font-size="13">43</text>
  </g>
  <g class="orig" transform="translate(470, 195)">
    <rect x="50" y="0" width="65" height="45" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1"/>
    <text x="82.5" y="22.5" font-size="13">3</text>
    <rect x="120" y="0" width="65" height="45" rx="6" fill="#1a1a2e" stroke="#10b981" stroke-width="1"/>
    <text x="152.5" y="22.5" font-size="13">9</text>
    <rect x="190" y="0" width="65" height="45" rx="6" fill="#1a1a2e" stroke="#ec4899" stroke-width="1"/>
    <text x="222.5" y="22.5" font-size="13">82</text>
    <rect x="260" y="0" width="65" height="45" rx="6" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1"/>
    <text x="292.5" y="22.5" font-size="13">10</text>
  </g>

  <!-- Merge arrows -->
  <g class="connect" opacity="1">
    <line x1="250" y1="260" x2="365" y2="320"/>
    <line x1="600" y1="260" x2="470" y2="320"/>
  </g>

  <!-- Row 3: Merging (sorted subarrays) -->
  <text x="180" y="290" font-size="11" fill="#10b981" font-weight="700" opacity="1" class="merged">MERGE</text>
  <g class="merged" transform="translate(80, 310)">
    <rect x="50" y="0" width="50" height="45" rx="6" fill="#1a1a2e" stroke="#ef4444" stroke-width="1"/>
    <text x="75" y="22.5" font-size="13">27</text>
    <rect x="105" y="0" width="50" height="45" rx="6" fill="#1a1a2e" stroke="#a855f7" stroke-width="1"/>
    <text x="130" y="22.5" font-size="13">38</text>
    <rect x="160" y="0" width="50" height="45" rx="6" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1"/>
    <text x="185" y="22.5" font-size="13">43</text>
  </g>
  <g class="merged" transform="translate(460, 310)">
    <rect x="50" y="0" width="50" height="45" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1"/>
    <text x="75" y="22.5" font-size="13">3</text>
    <rect x="105" y="0" width="50" height="45" rx="6" fill="#1a1a2e" stroke="#10b981" stroke-width="1"/>
    <text x="130" y="22.5" font-size="13">9</text>
    <rect x="160" y="0" width="50" height="45" rx="6" fill="#1a1a2e" stroke="#ec4899" stroke-width="1"/>
    <text x="185" y="22.5" font-size="13">10</text>
    <rect x="215" y="0" width="50" height="45" rx="6" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1"/>
    <text x="240" y="22.5" font-size="13">82</text>
  </g>

  <!-- ═══ FINAL: Fully sorted (bottom) ═══ -->
  <text x="400" y="410" font-size="11" fill="#a855f7" font-weight="700" opacity="1" class="sorted-row">FINAL RESULT</text>
  <g class="sorted-row" transform="translate(155, 420)">
    <rect x="0" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="27.5" y="22.5" font-size="14" fill="#10b981">3</text>
    <rect x="60" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="87.5" y="22.5" font-size="14" fill="#10b981">9</text>
    <rect x="120" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="147.5" y="22.5" font-size="14" fill="#10b981">10</text>
    <rect x="180" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="207.5" y="22.5" font-size="14" fill="#10b981">27</text>
    <rect x="240" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="267.5" y="22.5" font-size="14" fill="#10b981">38</text>
    <rect x="300" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="327.5" y="22.5" font-size="14" fill="#10b981">43</text>
    <rect x="360" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="387.5" y="22.5" font-size="14" fill="#10b981">82</text>
  </g>

  <!-- Step description -->
  <text x="40" y="485" class="step-desc" font-size="12">
    Split in halves → Sort each → Merge back together. Always O(n log n).
  </text>
</svg>
