<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateX(-20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes highlight {
      0%, 100% { fill: #1a1a2e; stroke: #3f3f46; }
      50% { fill: #581c87; stroke: #a855f7; }
    }

    @keyframes match {
      0% { fill: #1a1a2e; stroke: #3f3f46; }
      100% { fill: #065f46; stroke: #10b981; }
    }

    @keyframes pointerMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(0); }
    }

    text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      fill: #f4f4f5;
      text-anchor: middle;
      dominant-baseline: central;
    }

    label {
      font-size: 12px;
      fill: #71717a;
    }

    .bar {
      fill: #1a1a2e;
      stroke: #3f3f46;
      stroke-width: 1.5;
      transition: fill 0.3s, stroke 0.3s;
    }

    .bar:hover {
      fill: #581c87;
      stroke: #a855f7;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      fill: #e4e4e7;
      letter-spacing: 0.1em;
    }

    .subtitle {
      font-size: 11px;
      fill: #52525b;
      font-weight: 400;
    }

    /* Pointers */
    .ptr-left {
      animation: ptrL 4s ease-in-out infinite;
    }

    .ptr-right {
      animation: ptrR 4s ease-in-out infinite;
    }

    @keyframes ptrL {
      0%, 20%  { transform: translateX(0); }
      40%, 60% { transform: translateX(50px); }
      80%, 100% { transform: translateX(100px); }
    }

    @keyframes ptrR {
      0%, 20%  { transform: translateX(0); }
      40%, 60% { transform: translateX(-100px); }
      80%, 100% { transform: translateX(-150px); }
    }

    /* Bars animate up one by one */
    .bar-0 { animation: grow0 4s ease-in-out infinite; }
    .bar-1 { animation: grow1 4s ease-in-out infinite; }
    .bar-2 { animation: grow2 4s ease-in-out infinite; }
    .bar-3 { animation: grow3 4s ease-in-out infinite; }
    .bar-4 { animation: grow4 4s ease-in-out infinite; }
    .bar-5 { animation: grow5 4s ease-in-out infinite; }

    @keyframes grow0 {
      0%, 10% { opacity: 0; transform: scaleY(0); }
      15%, 85% { opacity: 1; transform: scaleY(1); }
      90%, 100% { opacity: 0; }
    }

    @keyframes grow1 {
      5%, 15% { opacity: 0; transform: scaleY(0); }
      20%, 80% { opacity: 1; transform: scaleY(1); }
      85%, 100% { opacity: 0; }
    }

    @keyframes grow2 {
      10%, 20% { opacity: 0; transform: scaleY(0); }
      25%, 75% { opacity: 1; transform: scaleY(1); }
      80%, 100% { opacity: 0; }
    }

    @keyframes grow3 {
      15%, 25% { opacity: 0; transform: scaleY(0); }
      30%, 70% { opacity: 1; transform: scaleY(1); }
      75%, 100% { opacity: 0; }
    }

    @keyframes grow4 {
      20%, 30% { opacity: 0; transform: scaleY(0); }
      35%, 65% { opacity: 1; transform: scaleY(1); }
      70%, 100% { opacity: 0; }
    }

    @keyframes grow5 {
      25%, 35% { opacity: 0; transform: scaleY(0); }
      40%, 60% { opacity: 1; transform: scaleY(1); }
      65%, 100% { opacity: 0; }
    }

    /* Step labels cycle */
    .step-label {
      animation: stepFade 4s ease-in-out infinite;
      font-size: 14px;
      fill: #a855f7;
    }

    @keyframes stepFade {
      0%, 10% { opacity: 0; }
      15%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" rx="16" fill="#0a0a0c"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#27272a"/>
  </pattern>
  <rect x="0" y="0" width="600" height="400" fill="url(#dots)"/>

  <!-- Title -->
  <text x="300" y="35" class="title" opacity="1">TWO SUM — TWO POINTER</text>
  <text x="300" y="55" class="subtitle">Find two numbers that add up to target</text>

  <!-- Array visualization -->
  <g transform="translate(100, 120)">
    <!-- Bar 1: [2, 7, 11, 15, 3, 6] -->
    <g class="bar-0" transform-origin="0 150">
      <rect class="bar" x="0" y="50" width="50" height="100" rx="6"/>
      <text x="25" y="100" opacity="1">2</text>
      <text x="25" y="175" class="label" font-size="10">[0]</text>
    </g>
    <g class="bar-1" transform-origin="60 150">
      <rect class="bar" x="60" y="30" width="50" height="120" rx="6"/>
      <text x="85" y="90" opacity="1">7</text>
      <text x="85" y="175" class="label" font-size="10">[1]</text>
    </g>
    <g class="bar-2" transform-origin="120 150">
      <rect class="bar" x="120" y="10" width="50" height="140" rx="6"/>
      <text x="145" y="80" opacity="1">11</text>
      <text x="145" y="175" class="label" font-size="10">[2]</text>
    </g>
    <g class="bar-3" transform-origin="180 150">
      <rect class="bar" x="180" y="0" width="50" height="150" rx="6"/>
      <text x="205" y="75" opacity="1">15</text>
      <text x="205" y="175" class="label" font-size="10">[3]</text>
    </g>
    <g class="bar-4" transform-origin="240 150">
      <rect class="bar" x="240" y="120" width="50" height="30" rx="6"/>
      <text x="265" y="135" opacity="1">3</text>
      <text x="265" y="175" class="label" font-size="10">[4]</text>
    </g>
    <g class="bar-5" transform-origin="300 150">
      <rect class="bar" x="300" y="45" width="50" height="105" rx="6"/>
      <text x="325" y="98" opacity="1">6</text>
      <text x="325" y="175" class="label" font-size="10">[5]</text>
    </g>

    <!-- Left pointer -->
    <g class="ptr-left">
      <polygon points="25,-30 17,-45 33,-45" fill="#a855f7"/>
      <text x="25" y="-55" font-size="11" fill="#a855f7" font-weight="700">L</text>
    </g>

    <!-- Right pointer -->
    <g class="ptr-right">
      <polygon points="325,-30 317,-45 333,-45" fill="#ef4444"/>
      <text x="325" y="-55" font-size="11" fill="#ef4444" font-weight="700">R</text>
    </g>
  </g>

  <!-- Target indicator -->
  <g transform="translate(480, 170)">
    <rect x="-40" y="-20" width="80" height="40" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="0" fill="#10b981" font-size="14" font-weight="700">= 8</text>
  </g>

  <!-- Step label -->
  <text x="300" y="350" class="step-label">2 + 6 = 8 → Found at indices [0] and [5]</text>
</svg>
